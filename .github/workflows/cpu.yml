name: CPU correctness and CLI
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall .
      - name: CLI help (no data download or GPU measurement)
        run: |
          python train.py --help
          python benchmark_train.py --help
          python benchmark_optimizations.py --help
          python profile_train.py --help
          python evaluate.py --help
          python experiment.py --help
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir dashboard/frontend build
